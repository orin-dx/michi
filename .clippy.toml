msrv                         = "1.93"
too-many-arguments-threshold = 6
too-many-lines-threshold     = 150

# Allow unwrap/expect in test code — idiomatic and avoids hundreds of #[allow] attrs
allow-unwrap-in-tests  = true
allow-expect-in-tests  = true
allow-panic-in-tests   = true

# Cognitive complexity (default is 25, we lower slightly)
cognitive-complexity-threshold = 20

# Ban debug/print macros in library code
disallowed-macros = [
    { path = "std::println",  reason = "library code must not print to stdout" },
    { path = "std::eprintln", reason = "library code must not print to stderr" },
    { path = "std::dbg",      reason = "debug macro must not ship in library code" },
]

# CLAUDE.md: BTreeMap for output maps, HashMap for internal state only.
# HashMap requires an explicit #[allow(clippy::disallowed_types)] with a
# one-line justification at each genuine internal-state use, so every site
# is a deliberate, reviewable choice rather than a silent default.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "BTreeMap for output maps; HashMap needs #[allow(clippy::disallowed_types)] + a reason for internal-state use" },
]

# unwrap()/expect() in lib code are banned via clippy::unwrap_used /
# clippy::expect_used (warned on in each crate's lib.rs), not disallowed-methods
# above -- disallowed-methods has no test-code exemption mechanism, while
# unwrap_used/expect_used correctly respect allow-unwrap-in-tests /
# allow-expect-in-tests.
