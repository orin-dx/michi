name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  INSTA_UPDATE: "no"
  RUST_BACKTRACE: 1

jobs:
  # Cheap, standalone check that .prototools is fully proto-installable.
  # This is the ONLY thing in this file that exercises the same
  # moonrepo/setup-toolchain -> proto install path callisto-release.yml's
  # Callisto actions use internally -- without this job, .prototools could
  # break silently and only surface at actual release time (which is what
  # happened: multiple tools here had no working proto plugin, and CI
  # stayed green through all of it since nothing here ever touched proto).
  prototools:
    name: .prototools is installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - run: cargo doc --workspace --no-deps --all-features
      # Default features on their own: intra-doc links to feature-gated items only break here.
      - run: cargo doc -p michi-core --no-deps

  markdown:
    name: Markdown format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-proto-node-pnpm@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - run: pnpm install --frozen-lockfile
      - run: CI=true pnpm exec oxfmt --ignore-path=.oxfmtignore --check "**/*.md"

  semver:
    name: SemVer (against crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-semver-checks
      # The baseline is the latest version of each crate published on crates.io. The release type comes from the
      # pending changesets, translated to cargo-semver-checks' terms: it names release types literally, so a breaking
      # change needs `major` even before 1.0, where Callisto's minor bump (0.3 -> 0.4) is the breaking bump.
      - run: python3 scripts/test_pending_release_type.py
      - name: Check API compatibility against the pending release type
        run: |
          set -euo pipefail
          # Front matter of the fixed group's changesets only (michi-graph's own bump must not loosen this check), or
          # the version bump when none are pending, as on Callisto's version PR.
          bash scripts/check-semver.sh
      # michi-graph releases with the group but has no crates.io baseline until its first publish; until then there is
      # nothing to compare. Its release type comes from its version, which the group bumps with the others.
      - name: Check michi-graph's API against crates.io
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' --user-agent "orin-dx/michi CI" \
            https://crates.io/api/v1/crates/michi-graph)
          case "$status" in
            200) cargo semver-checks check-release -p michi-graph ;;
            404) echo "michi-graph is not on crates.io yet; nothing to compare against" ;;
            *)
              echo "::error::crates.io answered $status; cannot tell whether michi-graph has a baseline"
              exit 1
              ;;
          esac

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/rust-version *= *"(.*)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv
      # `+version` because rust-toolchain.toml (stable) would otherwise win over the default toolchain.
      - run: cargo "+$MSRV" check --workspace --all-features --locked
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

  graph-license:
    name: michi-graph stays permissive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - run: python3 scripts/test_check_permissive_deps.py
      # michi-graph is MIT inside an FSL workspace: no non-permissive crate may enter what it ships.
      - run: cargo metadata --format-version 1 --all-features | python3 scripts/check-permissive-deps.py michi-graph

  graph-no-std:
    name: michi-graph builds without std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          targets: thumbv7em-none-eabihf
          cache-key: graph-no-std
      # A bare-metal target with no std: proves the crate is no_std + alloc. It needs pointer-sized atomics (Arc and
      # the builder id), which thumbv7em has; targets without compare-and-swap (thumbv6m) are not supported.
      - run: cargo build -p michi-graph --target thumbv7em-none-eabihf

  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - name: Assert every published package has the same version
        run: |
          crate_version() { grep -m1 '^version' "$1" | sed -E 's/version *= *"(.*)"/\1/'; }
          CORE=$(crate_version crates/michi-core/Cargo.toml)
          GRAPH=$(crate_version crates/michi-graph/Cargo.toml)
          PIPELINE=$(crate_version crates/michi-pipeline/Cargo.toml)
          NPM=$(node -p "require('./packages/michi-node/package.json').version")
          echo "michi-core: $CORE  michi-graph: $GRAPH  michi-pipeline: $PIPELINE  @orin-dx/michi: $NPM"
          if [ "$CORE" != "$GRAPH" ] || [ "$CORE" != "$PIPELINE" ] || [ "$CORE" != "$NPM" ]; then
            echo "::error::Version mismatch: michi-core=$CORE michi-graph=$GRAPH michi-pipeline=$PIPELINE @orin-dx/michi=$NPM"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest,just
      - run: cargo nextest run --workspace
      - run: cargo nextest run --workspace --all-features
      # Each published crate on its own, with only its default features. A workspace-wide run unifies features (the
      # napi shim turns on michi-core's serde), which hid a default-feature failure.
      - run: just test-crates-default
      # nextest does not run doctests (the crate docs and the michi-pipeline README example).
      # Not `napi`: doctest binaries can't link the Node symbols it references.
      - run: cargo test --doc -p michi-core --features serde,schemars,miette
      - run: cargo test --doc -p michi-pipeline --all-features
      - run: cargo test --doc -p michi-graph

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  bench-build:
    name: Bench (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
      - run: cargo bench --no-run --workspace

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/michi-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-proto-node-pnpm@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          working-directory: packages/michi-node
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  napi:
    name: NAPI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Every target in packages/michi-node/package.json's napi.targets. `cross`
      # links with cargo-zigbuild, as the release build does for these targets.
      # `test` runs the Node tests only where the runner executes the binary
      # natively: aarch64-unknown-linux-gnu builds on GitHub's arm64 runner for
      # that (still linked with cargo-zigbuild, so it tests the release's glibc
      # linkage), and musl or x86_64 macOS binaries can't load in the runner's Node.
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            test: true
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            test: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cross: true
            test: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: orin-dx/actions/setup-rust@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - uses: orin-dx/actions/setup-proto-node-pnpm@2521888266780dabc7f5fd4c32b02d6ab82849db # v1.1
        with:
          working-directory: packages/michi-node
      - run: pnpm install --frozen-lockfile
        working-directory: packages/michi-node
      - name: Install ziglang (cross-compile targets only)
        if: matrix.cross
        run: pip install ziglang
      - name: Cache cargo-zigbuild binary (cross-compile targets only)
        if: matrix.cross
        id: zigbuild-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-zigbuild-${{ matrix.target }}
      - name: Install cargo-zigbuild (cross-compile targets only)
        if: matrix.cross && steps.zigbuild-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked
      - run: pnpm build --target ${{ matrix.target }} ${{ matrix.cross && '--cross-compile' || '' }}
        working-directory: packages/michi-node
      - run: node --test __test__/index.test.mjs __test__/interop.test.mjs
        working-directory: packages/michi-node
        if: matrix.test
