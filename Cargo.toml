[workspace]
members  = [
  ".",
  "crates/michi-truncate",
  "crates/michi-resilience",
  "crates/michi-toon",
  "crates/michi-core",
  "crates/michi-pipeline",
  "packages/michi-node"
]
resolver = "2"

[workspace.package]
edition      = "2021"
rust-version = "1.96"
license      = "FSL-1.1-MIT"
repository   = "https://github.com/orin-dx/michi"
authors      = ["Orin DX"]
homepage     = "https://orin-dx.com/tools/michi/"

[workspace.dependencies]
thiserror   = "2"
compact_str = "0.8"
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = { version = "1.0.150", features = ["preserve_order"] }
schemars    = "0.8"
miette      = "7"
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug    = true

# Single source of truth for unsafe_code -- every crate in this workspace
# opts in via `[lints]`/`workspace = true`, replacing a hand-copied
# `#![deny(unsafe_code)]` at the top of every lib.rs. Stays "deny" (not
# "forbid") so the napi boundary's local `#![allow(unsafe_code)]` can still
# override it -- see CLAUDE.md's "No unsafe outside napi boundary".
#
# missing_docs / clippy::unwrap_used / clippy::expect_used /
# clippy::disallowed_types stay as per-crate `#![warn(...)]` inner
# attributes in each lib.rs instead of living here: `[lints]` applies to
# every target in a package (every integration test, bench, and example,
# not just the lib target), and those four lints are specifically meant to
# apply to library code only -- CLAUDE.md's "no unwrap/expect in lib code"
# rule was never meant to cover benches/examples, and doc-coverage doesn't
# make sense for internal test binaries. unsafe_code is the one lint here
# with no such exception (nothing outside the documented napi boundary
# should ever contain unsafe), so it's the only one safe to centralize.
[workspace.lints.rust]
unsafe_code = "deny"

[package]
name        = "michi"
version     = "0.2.0"
description = "AXI response primitives for agent-ergonomic tools"
readme      = "README.md"
keywords    = ["axi", "agent", "mcp", "cli", "llm"]
categories  = ["text-processing", "encoding", "development-tools"]
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lints]
workspace = true

[features]
default  = []
napi     = ["dep:napi", "dep:napi-derive", "dep:serde_json", "michi-core/serde"]
serde    = ["michi-core/serde", "michi-toon/serde"]
schemars = ["michi-core/schemars", "michi-toon/schemars"]
miette   = ["michi-core/miette"]

[dependencies]
michi-truncate   = { path = "crates/michi-truncate", version = "0.1.0" }
michi-resilience = { path = "crates/michi-resilience", version = "0.1.0" }
michi-toon       = { path = "crates/michi-toon", version = "0.2.0" }
michi-core       = { path = "crates/michi-core", version = "0.1.0" }

# napi feature
napi        = { version = "3", features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }
serde_json  = { workspace = true, optional = true }

[dev-dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
divan      = "0.1"
proptest   = "1"
insta      = { version = "1", features = ["yaml"] }

[[bench]]
name    = "toon_render"
harness = false

[[bench]]
name    = "kv_render"
harness = false
