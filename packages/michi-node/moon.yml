$schema: "https://moonrepo.dev/schemas/project.json"

language: typescript

tasks:
  build:
    script: "just build-node"
    inputs:
      - "src/**/*"
      - "__test__/**/*"
      - "package.json"
      - "Cargo.toml"
      - "/crates/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
  test:
    script: "just test-node"
    inputs:
      - "index.js"
      - "index.d.ts"
      - "__test__/**/*"
      - "package.json"
      - "/crates/**/*"
    deps:
      - build
