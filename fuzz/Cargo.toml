[package]
name        = "michi-fuzz"
version     = "0.0.0"
edition     = "2021"
publish     = false
license     = "FSL-1.1-MIT"
description = "cargo-fuzz targets for michi's no-panic, char-boundary, escaping and wire-input claims"

[package.metadata]
cargo-fuzz = true

# Standalone: not a member of the root workspace (see `exclude` there), so it has its own lockfile and never
# reaches `just check`, cargo-deny or the release tooling.
[workspace]

[dependencies]
libfuzzer-sys  = "0.4"
arbitrary      = { version = "1", features = ["derive"] }
serde          = "1"
serde_json     = "1"
tokio          = { version = "1", features = ["rt", "time"] }
michi-core     = { path = "../crates/michi-core", features = ["serde"] }
michi-graph    = { path = "../crates/michi-graph" }
michi-pipeline = { path = "../crates/michi-pipeline", features = ["serde"] }

[profile.release]
debug = 1

[[bin]]
name  = "toon_render"
path  = "fuzz_targets/toon_render.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "truncate"
path  = "fuzz_targets/truncate.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "resilience"
path  = "fuzz_targets/resilience.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "mcp_wire"
path  = "fuzz_targets/mcp_wire.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "graph"
path  = "fuzz_targets/graph.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "plan"
path  = "fuzz_targets/plan.rs"
test  = false
doc   = false
bench = false
