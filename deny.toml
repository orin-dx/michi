[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    # Every crate in this workspace except michi-graph is source-available
    # under FSL-1.1-MIT. michi-graph is MIT; `just check-graph-license` (and
    # the CI job of the same purpose) keeps any non-permissive license out of
    # what it ships.
    "FSL-1.1-MIT",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "criterion", reason = "CLAUDE.md: benchmarks use divan, not criterion" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
