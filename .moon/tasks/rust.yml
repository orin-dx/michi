# Global tasks inherited by every Rust crate in the workspace.
#
# build/test/lint/format/format-check are NOT defined here on
# purpose: a per-crate `cargo <cmd> -p $crate` fan-out serializes behind
# Cargo's shared target/ file lock (measured: 116s vs. 17.5s for one
# workspace-wide invocation). Those live once, workspace-wide, in root
# `moon.yml`; `justfile`'s `lint-affected` covers the incremental case.
#
# No publish task: Callisto publishes every package (see CONTRIBUTING.md's "Releasing").
tasks:
  audit:
    script: "cargo deny check advisories"
    inputs:
      - "Cargo.lock"
      - "Cargo.toml"
