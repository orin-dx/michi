[package]
name        = "michi-core"
description = "AXI response primitives for agent-ergonomic tools: TOON lists, key-value blocks, hints, errors, truncation and retry policy"
readme      = "../../README.md"
keywords    = ["axi", "agent", "mcp", "cli", "llm"]
categories  = ["text-processing", "encoding", "development-tools"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
compact_str = { workspace = true }
thiserror.workspace = true

serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars   = { workspace = true, optional = true }
miette     = { workspace = true, optional = true }

# napi feature
napi        = { version = "3", features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "3", optional = true }

[features]
default  = []
serde    = ["dep:serde", "dep:serde_json", "serde_json/float_roundtrip", "compact_str/serde"]
schemars = ["dep:schemars", "serde"]
miette   = ["dep:miette"]
napi     = ["dep:napi", "dep:napi-derive", "serde"]

[dev-dependencies]
serde      = { workspace = true }
# float_roundtrip here too, so the default-feature test build parses fixture floats correctly rounded.
serde_json = { workspace = true, features = ["float_roundtrip"] }
divan      = "0.1"
proptest   = "1"
insta      = { version = "1", features = ["yaml"] }
trybuild   = "1"

[[bench]]
name    = "toon_render"
harness = false

[[bench]]
name    = "kv_render"
harness = false
